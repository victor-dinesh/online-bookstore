{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-question-circle text-warning display-1 mb-3 d-block"></i>
        <h1 class="display-5 fw-bold text-dark">404 - Page Not Found</h1>
        <p class="lead text-muted mb-4">The page or book record you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-arrow-left me-1"></i> Return to Inventory Dashboard
        </a>
    </div>
</div>
{% endblock %}
