{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-octagon text-danger display-1 mb-3 d-block"></i>
        <h1 class="display-5 fw-bold text-dark">500 - Server Error</h1>
        <p class="lead text-muted mb-4">An unexpected error occurred while processing your request. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
            <i class="bi bi-house-door me-1"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
